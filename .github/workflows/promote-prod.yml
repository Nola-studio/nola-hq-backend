# Promotion PROD : avance `main` sur `dev` (fast-forward uniquement).
#
# C'est TOUT ce que fait ce workflow : le déploiement lui-même revient à
# l'intégration GitHub de Railway — le push sur `main` déclenche les checks
# du repo (s'il y en a) et Railway, gaté par « Wait for CI », build une fois
# tout au vert. L'environment GitHub `production` porte, si configuré, un
# gate d'approbation. Si `main` a divergé de `dev`, le job échoue — passer
# alors par une PR dev → main (même effet après merge).

name: promote prod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avancer-main:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main sur dev
        run: |
          git fetch origin dev main
          if git merge-base --is-ancestor origin/main origin/dev; then
            git push origin origin/dev:main
            echo "main avancé sur $(git rev-parse --short origin/dev) — Railway enchaîne."
          else
            echo "::error::main a divergé de dev — passer par une PR dev → main."
            exit 1
          fi
